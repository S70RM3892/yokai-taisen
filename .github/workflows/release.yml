# 妖怪大戦を公開する。
#   main に push → テスト → ビルド →
#     ・package.json の version の Release（v1.0.0 など）がまだ無ければ作り、yokai-taisen.html を添付
#     ・GitHub Pages に公開（https://<owner>.github.io/<repo>/）
#       ※ 初回だけ、リポジトリの Settings → Pages → Source を「GitHub Actions」にする
# 版を上げるときは package.json の version を上げて main に入れる。
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 公開するファイルをまとめる
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          touch _site/.nojekyll
          cp dist/index.html yokai-taisen.html
      - uses: actions/upload-artifact@v4
        with:
          name: yokai-taisen
          path: yokai-taisen.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yokai-taisen
      - name: Release を作る（同じ版がまだ無いときだけ）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(node -p "require('./package.json').version")"
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "$VER はもうある"
          else
            gh release create "$VER" yokai-taisen.html --target "$GITHUB_SHA" \
              --title "妖怪大戦 $VER" \
              --notes "yokai-taisen.html をダウンロードしてブラウザで開くだけで遊べる（1 ファイル）。オンライン版：https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
